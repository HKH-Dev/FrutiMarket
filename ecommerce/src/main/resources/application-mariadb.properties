# Se activa solo con el perfil "mariadb"
# Usuario de aplicacion (no root). DB_USER y DB_PASSWORD vienen de .env, que ya importa
# application.properties. Aqui la contrasena es obligatoria: sin ella la aplicacion no arranca.
spring.datasource.url=jdbc:mariadb://${DB_HOST:localhost}:${DB_PORT:3307}/${DB_NAME:ecommercedb}
spring.datasource.username=${DB_USER:ecommerce_app}
spring.datasource.password=${DB_PASSWORD}

# --- Esquema: lo crea y versiona Flyway, no Hibernate ---
# Flyway ejecuta en orden los scripts V1__, V2__... que aun no se hayan aplicado y los anota en
# la tabla flyway_schema_history. db/migration = estructura (siempre); db/datos-ejemplo = catalogo
# inicial de prueba (quitelo de la lista en produccion).
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration,classpath:db/datos-ejemplo

# validate: Hibernate NO crea ni modifica tablas; solo comprueba al arrancar que las entidades
# coinciden con el esquema que dejo Flyway. Si alguien cambia una entidad sin migracion, no arranca.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# no cargar data.sql: los datos iniciales de MariaDB vienen de Flyway
spring.sql.init.mode=never
# En H2 se retrasa la carga de data.sql hasta despues de JPA. Con Flyway debe ser al reves
# (primero las tablas, luego JPA); dejarlo en true provoca una dependencia circular al arrancar.
spring.jpa.defer-datasource-initialization=false

# la consola H2 no aplica aqui
spring.h2.console.enabled=false

# Swagger sigue activo; desactivelo en produccion con springdoc.api-docs.enabled=false

# No exponer detalles internos en los errores de la API
frutimarket.errores.mostrar-causa=false
