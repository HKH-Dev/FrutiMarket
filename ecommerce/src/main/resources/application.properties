spring.application.name=ecommerce
server.port=8080

# --- Credenciales: se leen del archivo .env (igual en Linux, Windows e IntelliJ) ---
# Se busca .env en la carpeta desde la que se ejecuta: ecommerce/ o la raiz del repositorio.
# Las variables de entorno del sistema tienen prioridad sobre el archivo.
spring.config.import=optional:file:.env[.properties],optional:file:ecommerce/.env[.properties]

# --- Base de datos H2 (en memoria, perfil por defecto) ---
# H2 crea la base al conectarse por primera vez, y el usuario de esa conexion queda como su
# administrador. Por eso DB_USER/DB_PASSWORD de .env son el usuario y la clave de la consola H2.
# Sin .env se usa "sa" sin contrasena (asi funcionan las pruebas y un clon recien descargado).
spring.datasource.url=jdbc:h2:mem:${DB_NAME:ecommercedb}
spring.datasource.username=${DB_USER:ecommerce_app}
spring.datasource.password=${DB_PASSWORD:}

# --- Flyway (migraciones de esquema) ---
# Con H2 las tablas las crea Hibernate (create-drop) y los datos vienen de data.sql.
# Flyway solo se usa con MariaDB: ver application-mariadb.properties y src/main/resources/db/.
spring.flyway.enabled=false

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true
spring.jpa.open-in-view=false

# --- Consola web de H2 ---
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- Swagger / OpenAPI (springdoc) ---
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# --- Errores de la API ---
# Muestra al cliente la causa tecnica de un JSON ilegible (nombres de clases Java). Solo para desarrollo.
frutimarket.errores.mostrar-causa=true

# --- Seguridad (JWT) ---
# Clave para firmar los tokens: minimo 32 caracteres. Cambiela en su .env (JWT_SECRET).
frutimarket.seguridad.jwt-secreto=${JWT_SECRET:clave-de-desarrollo-frutimarket-cambiar-en-env-2026}
frutimarket.seguridad.expiracion-minutos=60
# Usuarios de demostracion (uno por rol). Al arrancar se guardan en la tabla usuarios con la clave
# cifrada con BCrypt; los demas usuarios se crean con POST /api/auth/registro.
# actor-id vincula el usuario con el campesino (Maria Gomez) o el comprador (Restaurante El Solar)
# de los datos de ejemplo.
# Las claves se pueden cambiar en .env.
frutimarket.seguridad.usuarios[0].correo=admin@frutimarket.com
frutimarket.seguridad.usuarios[0].clave=${ADMIN_CLAVE:admin123}
frutimarket.seguridad.usuarios[0].rol=ADMIN
frutimarket.seguridad.usuarios[1].correo=campesino@frutimarket.com
frutimarket.seguridad.usuarios[1].clave=${CAMPESINO_CLAVE:campesino123}
frutimarket.seguridad.usuarios[1].rol=CAMPESINO
frutimarket.seguridad.usuarios[1].actor-id=22222222-0000-0000-0000-000000000001
frutimarket.seguridad.usuarios[2].correo=comprador@frutimarket.com
frutimarket.seguridad.usuarios[2].clave=${COMPRADOR_CLAVE:comprador123}
frutimarket.seguridad.usuarios[2].rol=COMPRADOR
frutimarket.seguridad.usuarios[2].actor-id=33333333-0000-0000-0000-000000000001

# --- CORS ---
# Origenes (separados por coma) desde los que un navegador puede llamar a la API.
frutimarket.cors.origenes=${CORS_ORIGENES:http://localhost:4200}
