services:
  mariadb:
    image: mariadb:11
    container_name: mariadb-ecommerce
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${DB_NAME:-ecommercedb}
      # Usuario de aplicacion: solo tiene permisos sobre MARIADB_DATABASE
      MARIADB_USER: ${DB_USER:-ecommerce_app}
      MARIADB_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT:-3307}:3306"
    volumes:
      - mariadb-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mariadb-data:
