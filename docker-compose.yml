# Pila completa: docker compose up --build -d   (antes: cp .env.example .env y cambiar los valores)
# Solo el frontend publica un puerto; backend y base de datos quedan en la red interna.
services:
  db:
    image: mariadb:11.8
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Defina DB_ROOT_PASSWORD en .env}
      MARIADB_DATABASE: ${DB_NAME:-ecommercedb}
      MARIADB_USER: ${DB_USER:-ecommerce_app}
      MARIADB_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD en .env}
    volumes:
      - datos-db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: ./ecommerce
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: mariadb
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-ecommercedb}
      DB_USER: ${DB_USER:-ecommerce_app}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET en .env}
      ADMIN_CLAVE: ${ADMIN_CLAVE:?Defina ADMIN_CLAVE en .env}
      CAMPESINO_CLAVE: ${CAMPESINO_CLAVE:?Defina CAMPESINO_CLAVE en .env}
      COMPRADOR_CLAVE: ${COMPRADOR_CLAVE:?Defina COMPRADOR_CLAVE en .env}
      CORS_ORIGENES: ${ORIGEN_PUBLICO:-http://localhost:8088}
      TZ: America/Bogota

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${PUERTO_WEB:-8088}:8080"

volumes:
  datos-db:
